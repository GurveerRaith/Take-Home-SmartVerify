services:
  db:
    image: postgres:16
    container_name: smartverify-db
    # Values come from the .env file in this directory, which Docker Compose
    # reads automatically. The :- defaults keep the stack working if .env is
    # missing, rather than silently substituting empty strings.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policy}
      POSTGRES_DB: ${POSTGRES_DB:-smartverify}
    ports:
      # Host 5433 so this never collides with a Postgres you already run locally.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - smartverify_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-policy} -d ${POSTGRES_DB:-smartverify}",
        ]
      start_period: 3s
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  smartverify_db_data:
